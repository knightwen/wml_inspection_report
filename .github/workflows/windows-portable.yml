name: Windows portable build

on:
  push:
    branches: ['main', 'master', 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        edition: [bilingual, english]
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/distribution.py $env:GITHUB_REF_NAME
      - name: Install fixed build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Test application
        run: |
          python workbench/test_workbench.py
          python workbench/test_calculation.py
          python workbench/test_content_blocks.py
          python tools/test_english_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser regression dependencies
        run: |
          npm install --prefix .build/browser-deps --no-save --package-lock=false playwright@1.62.1
          npx --prefix .build/browser-deps playwright install chromium
      - name: Test save queue and browser workflows
        env:
          WML_TEST_BROWSER_CHANNEL: chromium
        run: |
          node tools/test_i18n.cjs
          node tools/test_draft_state.cjs
          node tools/test_browser_workbench.cjs
          node tools/test_calculation_browser.cjs
          node tools/test_workspace_layout.cjs
      - name: Validate Word template and generated reports
        shell: powershell
        run: |
          ./tools/validate_reports.ps1
          ./tools/validate_reports.ps1 -Paths .build/qa/rich-inspection-browser.docx,.build/qa/browser-calculation.docx
      - name: Build, package and test extracted ZIP
        run: python tools/package_workbench.py --build --edition ${{ matrix.edition }}
      - name: Validate report generated by portable EXE
        shell: powershell
        run: |
          $report = if ('${{ matrix.edition }}' -eq 'english') { '.build/qa/english/frozen-generated.docx' } else { '.build/qa/frozen-generated.docx' }
          ./tools/validate_reports.ps1 -Paths $report
      - name: Save portable download
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ matrix.edition }}-x64
          path: |
            outputs/InspectionWorkbench*_v*_Windows_x64.zip
            outputs/InspectionWorkbench*_v*_Windows_x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save verification results and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ matrix.edition }}
          path: |
            .build/qa/frozen-smoke-result.json
            .build/qa/frozen-generated.docx
            .build/qa/frozen-failure.log
            .build/qa/english/frozen-smoke-result.json
            .build/qa/english/frozen-generated.docx
            .build/qa/english/frozen-failure.log
            .build/qa/browser-stability-result.json
            .build/qa/browser-stability.png
            .build/pyinstaller-*/InspectionWorkbench/warn-InspectionWorkbench.txt
            .build/pyinstaller-*/InspectionWorkbenchEnglish/warn-InspectionWorkbenchEnglish.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-portable-*-x64
          merge-multiple: true
          path: release-assets
      - name: Publish verified portable ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check *.sha256
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip ./*.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Inspection Workbench $GITHUB_REF_NAME" \
              --notes-file "$GITHUB_WORKSPACE/docs/RELEASE_NOTES_$GITHUB_REF_NAME.md"
          fi
