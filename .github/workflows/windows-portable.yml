name: Windows portable build

on:
  push:
    branches: ['main', 'master', 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/distribution.py $env:GITHUB_REF_NAME
      - name: Install fixed build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Test application
        run: python workbench/test_workbench.py
      - name: Validate Word template and generated reports
        shell: powershell
        run: ./tools/validate_reports.ps1
      - name: Build, package and test extracted ZIP
        run: python tools/package_workbench.py --build
      - name: Validate report generated by portable EXE
        shell: powershell
        run: ./tools/validate_reports.ps1 -Paths '.build/qa/frozen-generated.docx'
      - name: Save portable download
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-x64
          path: |
            outputs/InspectionWorkbench_v*_Windows_x64.zip
            outputs/InspectionWorkbench_v*_Windows_x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save verification results and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            .build/qa/frozen-smoke-result.json
            .build/qa/frozen-generated.docx
            .build/qa/frozen-failure.log
            .build/pyinstaller-*/InspectionWorkbench/warn-InspectionWorkbench.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-x64
          path: release-assets
      - name: Publish verified portable ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check *.sha256
          printf '%s\n' \
            'Windows 10/11 x64: download the ZIP, extract the complete folder, then double-click InspectionWorkbench.exe.' \
            'No Python or Word installation is required to generate reports.' \
            'Keep WorkbenchData when upgrading, or export/import a draft backup.' \
            'The ZIP includes application sources, third-party notices and HEIC component sources.' > "$RUNNER_TEMP/release-notes.txt"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip ./*.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Inspection Workbench $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
